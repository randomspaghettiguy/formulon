name: Build and Test

on:
  push:
    branches: [main, feat/complete-formula-engine]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install (also builds, through prepare)
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests, the formula case file, fuzzing
        run: yarn test --run

      - name: Bundle size budget
        run: yarn size
